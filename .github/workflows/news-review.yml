name: Collect and review news

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: news-review
  cancel-in-progress: false

jobs:
  collect-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Skip while a review pull request is open
        id: pending-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          count="$(gh pr list --state open --head "${GITHUB_REPOSITORY_OWNER}:automation/news-review" --json number --jq 'length')"
          if [ "$count" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "A news review pull request is already open; leaving it unchanged."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.pending-pr.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.pending-pr.outputs.skip != 'true'
        run: python -m pip install -r requirements.txt

      - name: Collect news
        if: steps.pending-pr.outputs.skip != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python toxic_news_v33.py

      - name: Add candidates to the review queue
        id: collect
        if: steps.pending-pr.outputs.skip != 'true'
        run: python news_review_pipeline.py collect

      - name: Open a review pull request
        if: steps.pending-pr.outputs.skip != 'true' && steps.collect.outputs.added != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "news: add candidates for review"
          branch: automation/news-review
          delete-branch: true
          title: "ตรวจข่าวใหม่ก่อนแสดงบนแผนที่"
          body: |
            ตรวจรายการใน `data/news_review_queue.json`

            เปลี่ยน `status` ของแต่ละรายการเป็น `approved` หรือ `rejected` แล้วจึง merge PR
            ข่าวที่อนุมัติและมีพิกัดที่จับคู่ได้จะถูกส่งขึ้นแผนที่หลัง merge
            รายการที่ยัง `pending` จะไม่แสดง
          add-paths: data/news_review_queue.json
